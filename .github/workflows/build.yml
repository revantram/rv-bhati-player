name: Build RV Bhati Player APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mobile shortcut: repo me sirf project.zip + build.yml upload karein,
      # yeh step zip ko khol kar poora project taiyar kar dega.
      - name: Unpack project.zip (optional)
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip -d .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Repo me sirf lib/, pubspec.yaml, android_overrides/ hai.
      # android/ folder yahin generate hota hai (PC ki zarurat nahi).
      - name: Generate android platform folder
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rvbhati --project-name rv_bhati_player /tmp/gen
            cp -r /tmp/gen/android ./android
          fi

      - name: Apply manifest, MainActivity and package name (com.rvbhati.player)
        run: |
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/rvbhati/player
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/com/rvbhati/player/MainActivity.kt
          sed -i 's/com\.rvbhati\.rv_bhati_player/com.rvbhati.player/g' android/app/build.gradle* || true

      - name: Configure Gradle wrapper and mirror fallbacks
        run: |
          # Pre-download Gradle binary distribution to /tmp with retries to avoid GitHub 504 timeouts
          curl -fL --retry 5 --retry-delay 3 -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip || \
          curl -fL --retry 5 --retry-delay 3 -o /tmp/gradle-9.3.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|^distributionUrl=.*|distributionUrl=file\\:/tmp/gradle-9.3.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons (agar assets/icon/app_icon.png hai)
        run: |
          if [ -f assets/icon/app_icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "Custom icon nahi mila, default icon use hoga"
          fi

      - name: Build release APK (optimized & split per ABI)
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Prepare APKs for release
        run: |
          cd build/app/outputs/flutter-apk
          # Primary APK for modern phones (ARM64)
          cp app-arm64-v8a-release.apk RV-Bhati-Player.apk
          cp app-arm64-v8a-release.apk RV-Bhati-Player-arm64.apk
          cp app-armeabi-v7a-release.apk RV-Bhati-Player-armv7-32bit.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RV-Bhati-Player-APK
          path: build/app/outputs/flutter-apk/RV-Bhati-Player.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.6
          name: "RV Bhati Player v1.1.6 (Apple iOS Light Glassmorphism & Audio Preference System)"
          files: |
            build/app/outputs/flutter-apk/RV-Bhati-Player.apk
            build/app/outputs/flutter-apk/RV-Bhati-Player-arm64.apk
            build/app/outputs/flutter-apk/RV-Bhati-Player-armv7-32bit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
