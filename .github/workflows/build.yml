name: Build RV Bhati Player APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mobile shortcut: repo me sirf project.zip + build.yml upload karein,
      # yeh step zip ko khol kar poora project taiyar kar dega.
      - name: Unpack project.zip (optional)
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip -d .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Repo me sirf lib/, pubspec.yaml, android_overrides/ hai.
      # android/ folder yahin generate hota hai (PC ki zarurat nahi).
      - name: Generate android platform folder
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rvbhati --project-name rv_bhati_player /tmp/gen
            cp -r /tmp/gen/android ./android
          fi

      - name: Apply manifest, MainActivity, package name and permanent release signing
        run: |
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp android_overrides/res/xml/filepaths.xml android/app/src/main/res/xml/filepaths.xml
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/rvbhati/player
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/com/rvbhati/player/MainActivity.kt
          sed -i 's/com\.rvbhati\.rv_bhati_player/com.rvbhati.player/g' android/app/build.gradle* || true

          # Apply permanent release keystore so APK signature NEVER changes
          cp android_overrides/keystore/release.jks android/app/release.jks
          python3 android_overrides/patch_signing.py

      - name: Configure Gradle wrapper and mirror fallbacks
        run: |
          # Pre-download Gradle binary distribution to /tmp with retries to avoid GitHub 504 timeouts
          curl -fL --retry 5 --retry-delay 3 -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip || \
          curl -fL --retry 5 --retry-delay 3 -o /tmp/gradle-9.3.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|^distributionUrl=.*|distributionUrl=file\\:/tmp/gradle-9.3.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi

          # Patch all android build and settings files with fast reliable mirrors
          find android -type f -name "*.kts" -exec sed -i 's|google()|maven("https://maven.aliyun.com/repository/public")\n        maven("https://maven.aliyun.com/repository/google")\n        google()|g' {} + || true
          find android -type f -name "*.gradle" -exec sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/public" }\n        maven { url "https://maven.aliyun.com/repository/google" }\n        google()|g' {} + || true
          find android -type f -name "*.kts" -exec sed -i 's|mavenCentral()|maven("https://maven.aliyun.com/repository/public")\n        mavenCentral()|g' {} + || true
          find android -type f -name "*.gradle" -exec sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }\n        mavenCentral()|g' {} + || true

          # Also patch Flutter SDK's internal gradle build ($FLUTTER_ROOT/packages/flutter_tools/gradle)
          if [ -d "$FLUTTER_ROOT/packages/flutter_tools/gradle" ]; then
            find "$FLUTTER_ROOT/packages/flutter_tools/gradle" -type f -name "*.kts" -exec sed -i 's|mavenCentral()|maven("https://maven.aliyun.com/repository/public")\n        mavenCentral()|g' {} + || true
            find "$FLUTTER_ROOT/packages/flutter_tools/gradle" -type f -name "*.gradle" -exec sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }\n        mavenCentral()|g' {} + || true
          fi

          # Apply Gradle init script to transparently rewrite Maven Central URL to Aliyun mirror
          mkdir -p ~/.gradle/init.d
          cp android_overrides/mirror.gradle ~/.gradle/init.d/mirror.gradle

      - name: Install dependencies
        run: |
          flutter pub get
          # Patch downloaded pub packages' android build.gradle files with mirrors
          find "$PUB_CACHE" -type f -name "*.gradle" -exec sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }\n        mavenCentral()|g' {} + || true
          find "$PUB_CACHE" -type f -name "*.gradle" -exec sed -i 's|google()|maven { url "https://maven.aliyun.com/repository/google" }\n        google()|g' {} + || true
          find "$PUB_CACHE" -type f -name "*.gradle" -exec sed -i 's|proguard-android\.txt|proguard-android-optimize.txt|g' {} + || true

      - name: Generate launcher icons (agar assets/icon/app_icon.png hai)
        run: |
          if [ -f assets/icon/app_icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "Custom icon nahi mila, default icon use hoga"
          fi

      - name: Build release APK (Universal + split per ABI)
        run: |
          mkdir -p build/app/outputs/symbols
          # 1. Build Universal (Fat) APK containing ALL architectures (arm64, armeabi-v7a, x86_64)
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
          # 2. Build Split per ABI APKs for optimized phone installs
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Prepare APKs for release
        run: |
          cd build/app/outputs/flutter-apk
          # Universal APK (Compatible with 100% of all TVs, Fire TV Sticks, Tablets & Phones)
          cp app-release.apk RV-Bhati-Player-Universal.apk
          cp app-release.apk RV-Bhati-Player-AndroidTV.apk
          # Split APKs for phones & low storage devices
          cp app-arm64-v8a-release.apk RV-Bhati-Player.apk
          cp app-arm64-v8a-release.apk RV-Bhati-Player-arm64.apk
          cp app-armeabi-v7a-release.apk RV-Bhati-Player-armv7-32bit.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RV-Bhati-Player-APK
          path: build/app/outputs/flutter-apk/RV-Bhati-Player-Universal.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name }}
          name: "RV Bhati Player ${{ github.ref_name }} (Universal Android TV & Phone Edition)"
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/RV-Bhati-Player-Universal.apk
            build/app/outputs/flutter-apk/RV-Bhati-Player-AndroidTV.apk
            build/app/outputs/flutter-apk/RV-Bhati-Player.apk
            build/app/outputs/flutter-apk/RV-Bhati-Player-arm64.apk
            build/app/outputs/flutter-apk/RV-Bhati-Player-armv7-32bit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
